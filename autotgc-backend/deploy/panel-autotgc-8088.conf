# DEPRECATED — superseded by panel-vhost.conf (the canonical :8088 vhost).
# Both define `listen 8088; server_name _;`, so only ONE may be symlinked into
# sites-enabled at a time or nginx will use a non-deterministic ruleset. A human
# should remove this file's symlink from sites-enabled and keep panel-vhost.conf.
# Until then, timeouts here are kept reconciled (120s) with the canonical vhost so
# whichever is active behaves identically. Do NOT change runtime here.
#
# SECURITY: see panel-vhost.conf header — :8088 is plaintext and must sit behind
# TLS (panel/certbot), not be exposed directly to the public internet.
server {
    listen 8088;
    listen [::]:8088;
    server_name _;

    # --- Frontend SPA (static) -------------------------------------------------
    # Built assets are synced to /opt/autotgc-frontend/dist by the deploy script.
    root /opt/autotgc-frontend/dist;
    index index.html;

    # --- Compression (load-speed) ---------------------------------------------
    # gzip ships with stock nginx (always available). Compresses text assets
    # (JS/CSS/JSON/SVG) at the proxy; already-compressed binaries (images/fonts)
    # are skipped. SSE/stream locations below set `gzip off` so deltas flush live.
    gzip on;
    gzip_vary on;                 # emit "Vary: Accept-Encoding" for correct caching
    gzip_proxied any;             # also compress JSON proxied from the Node backend
    gzip_comp_level 5;            # CPU vs ratio sweet spot for text
    gzip_min_length 1024;         # skip tiny responses
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf
        application/vnd.ms-fontobject;
    # text/html is gzipped automatically when gzip is on; no need to list it.

    # --- (optional) brotli ----------------------------------------------------
    # Enable ONLY if `nginx -V` shows the ngx_brotli module is compiled in,
    # otherwise `nginx -t` fails with "unknown directive brotli". Leave commented:
    #   brotli on;
    #   brotli_comp_level 5;
    #   brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    # Long-cache fingerprinted build assets.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # AI generation streaming (SSE): no buffering + long read timeout so content
    # deltas flush to the browser immediately and are not cut by the 60s /api/
    # read timeout. MUST precede the generic /api/ location is not required
    # (exact-match `=` wins over prefix), but kept high for clarity.
    location = /api/v1/generation/multi-format/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;  # never compress SSE: buffering breaks live delta flushing
        proxy_read_timeout 180s;
    }

    # --- API (proxied to the Node backend) ------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # WebSocket upgrade for the realtime stream (must allow Upgrade/Connection).
    location /api/v1/ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # SSE stream: disable buffering so events flush immediately.
    location = /api/v1/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;  # never compress SSE
        proxy_read_timeout 3600s;
    }
    location = /api/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;  # never compress SSE
        proxy_read_timeout 3600s;
    }

    # Health/readiness/docs proxied to the backend.
    location /healthz { proxy_pass http://127.0.0.1:3000; }
    location /readyz  { proxy_pass http://127.0.0.1:3000; }
    location /docs    { proxy_pass http://127.0.0.1:3000; }

    # --- SPA fallback ----------------------------------------------------------
    # Any non-API, non-asset path serves index.html so client-side routing works.
    # index.html must NOT be cached so clients always fetch the current shell,
    # which references the latest fingerprinted /assets/* files.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
