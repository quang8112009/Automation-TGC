# AutoTGC — single-origin vhost (SPA + API) for ${DOMAIN}.
#
# Rendered from this template by deploy/setup-domain.sh (envsubst replaces only
# ${DOMAIN} and ${FRONTEND_DIST}; nginx runtime vars like $host/$uri are kept).
#
# The SPA (built static files) and the API live on the SAME origin, which is
# exactly what the frontend expects (VITE_API_BASE empty → relative /api). This
# means NO CORS preflight in production and the realtime ws(s):// is derived
# from the page origin automatically.

# --- HTTP :80 — ACME challenge + permanent redirect to HTTPS ----------------
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};

    # Let's Encrypt http-01 challenge (served from the webroot certbot uses).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# __HTTPS_BLOCK__  (setup-domain.sh slices the file here during HTTP bootstrap)
# --- HTTPS :443 — SPA + API -------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;

    # HSTS (only after you confirm HTTPS works for every subpath).
    add_header Strict-Transport-Security "max-age=31536000" always;

    # --- Frontend SPA (static) ------------------------------------------------
    root ${FRONTEND_DIST};
    index index.html;

    # Long-cache fingerprinted build assets.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- API (proxied to the Node backend) ------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # WebSocket upgrade for the realtime stream (must allow Upgrade/Connection).
    location /api/v1/ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # SSE streams: disable buffering so events flush immediately.
    location = /api/v1/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    location = /api/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Health/readiness/docs proxied to the backend.
    location /healthz { proxy_pass http://127.0.0.1:3000; }
    location /readyz  { proxy_pass http://127.0.0.1:3000; }
    location /docs    { proxy_pass http://127.0.0.1:3000; }

    # ACME renewal challenge over HTTP is handled by the :80 block above; keep a
    # copy here so a forced-HTTPS renewal hook can still validate if needed.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # --- SPA fallback ----------------------------------------------------------
    # Any non-API, non-asset path serves index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
