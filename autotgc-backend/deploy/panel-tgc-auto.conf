server {
    listen 80;
    listen [::]:80;
    server_name tgc-auto.thiennn.icu;

    root /opt/autotgc-frontend/dist;
    index index.html;

    # --- Compression (load-speed) ---------------------------------------------
    # gzip ships with stock nginx (always available). Compresses text assets
    # (JS/CSS/JSON/SVG) at the proxy; already-compressed binaries (images/fonts)
    # are skipped. SSE/stream locations below set `gzip off` so deltas flush live.
    gzip on;
    gzip_vary on;                 # emit "Vary: Accept-Encoding" for correct caching
    gzip_proxied any;             # also compress JSON proxied from the Node backend
    gzip_comp_level 5;            # CPU vs ratio sweet spot for text
    gzip_min_length 1024;         # skip tiny responses
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf
        application/vnd.ms-fontobject;
    # text/html is gzipped automatically when gzip is on; no need to list it.

    # --- (optional) brotli ----------------------------------------------------
    # Enable ONLY if `nginx -V` shows the ngx_brotli module is compiled in,
    # otherwise `nginx -t` fails with "unknown directive brotli". Leave commented:
    #   brotli on;
    #   brotli_comp_level 5;
    #   brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # AI generation streaming (SSE): no buffering + long read timeout so content
    # deltas flush to the browser immediately (exact-match wins over /api/).
    location = /api/v1/generation/multi-format/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;  # never compress SSE: buffering breaks live delta flushing
        proxy_read_timeout 180s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location /api/v1/ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location = /api/v1/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;  # never compress SSE
        proxy_read_timeout 3600s;
    }
    location = /api/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;  # never compress SSE
        proxy_read_timeout 3600s;
    }

    location /healthz { proxy_pass http://127.0.0.1:3000; }
    location /readyz  { proxy_pass http://127.0.0.1:3000; }
    location /docs    { proxy_pass http://127.0.0.1:3000; }

    # SPA fallback. index.html must NOT be cached so clients always fetch the
    # current shell, which references the latest fingerprinted /assets/* files.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}

# --- HTTP/2 note (TLS terminated upstream) ------------------------------------
# This vhost listens on :80 only; TLS for tgc-auto.thiennn.icu is terminated by
# the hosting panel (CWP/aaPanel) in front of nginx. HTTP/2 must be enabled on
# the TLS listener, e.g. `listen 443 ssl http2;` (or `http2 on;` on nginx >= 1.25.1).
# Do NOT add it here without a local `ssl` listener — `http2` on a plain :80
# block has no effect and mixing it with panel-managed TLS can break the cert.
# Recommendation: enable HTTP/2 on the panel's 443 server block for this domain.
