# CANONICAL :8088 vhost for AutoTGC (SPA + reverse proxy to the Node backend).
# NOTE: panel-autotgc-8088.conf is a DEPRECATED duplicate of this file — only one
# should be symlinked into sites-enabled. See that file's header.
#
# SECURITY: this :8088 listener serves an AUTHENTICATED API (Bearer/JWT) and the
# SPA. It is plaintext HTTP and is expected to sit BEHIND TLS termination
# (panel/certbot terminates HTTPS out-of-band and proxies here). Do NOT expose
# :8088 directly to the public internet without TLS in front; restrict it to the
# loopback/panel upstream or a firewall-allowed source. A direct-HTTPS setup
# would add an HTTP->HTTPS 301 redirect server block (left out here because TLS
# is handled by the panel layer).
server {
    listen 8088;
    listen [::]:8088;
    server_name _;

    # --- Frontend SPA (static) -------------------------------------------------
    # Built assets are synced to /opt/autotgc-frontend/dist by the deploy script.
    root /opt/autotgc-frontend/dist;
    index index.html;

    # --- Security response headers --------------------------------------------
    # The static SPA shell (index.html) and /assets/* are served directly by
    # nginx and therefore DO NOT pass through the Node app's helmet layer, which
    # only covers proxied /api/ responses. These headers close that gap for the
    # static surface. `always` ensures they are emitted on error responses too.
    #
    # NOTE on nginx semantics: `add_header` in a child `location` REPLACES (does
    # not merge) inherited headers, so any location that sets its own add_header
    # (here: /assets/ and the SPA fallback `/`) MUST re-declare these. Keep the
    # three blocks in sync.
    #
    # HSTS: delivered unconditionally but only takes effect when the response was
    # served over HTTPS (browsers ignore Strict-Transport-Security received over
    # plain HTTP), so it is safe behind the panel's TLS terminator and a no-op if
    # this vhost is ever hit over plaintext. If the panel already sets HSTS,
    # remove the line here to avoid a duplicate header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Compression (load-speed) ---------------------------------------------
    # gzip ships with stock nginx (always available). Compresses text assets
    # (JS/CSS/JSON/SVG) at the proxy; already-compressed binaries (images/fonts)
    # are skipped. SSE/stream locations below set `gzip off` so deltas flush live.
    gzip on;
    gzip_vary on;                 # emit "Vary: Accept-Encoding" for correct caching
    gzip_proxied any;             # also compress JSON proxied from the Node backend
    gzip_comp_level 5;            # CPU vs ratio sweet spot for text
    gzip_min_length 1024;         # skip tiny responses
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf
        application/vnd.ms-fontobject;
    # text/html is gzipped automatically when gzip is on; no need to list it.

    # --- (optional) brotli ----------------------------------------------------
    # Enable ONLY if `nginx -V` shows the ngx_brotli module is compiled in,
    # otherwise `nginx -t` fails with "unknown directive brotli". Leave commented:
    #   brotli on;
    #   brotli_comp_level 5;
    #   brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    # Long-cache fingerprinted build assets.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Re-declared because this location sets its own add_header (see note above).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "0" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # --- API (proxied to the Node backend) ------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # MUST stay >= the app's AI client timeout (GEMINI_TIMEOUT_MS ~90s) so the
        # proxy never cuts an in-flight AI request before the app can fall back.
        # Was 60s (premature 504 on slow AI calls) — raised to 120s.
        proxy_read_timeout 120s;
    }

    # WebSocket upgrade for the realtime stream (must allow Upgrade/Connection).
    location /api/v1/ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Forward the scheme too so the app's per-IP rate limiting / trustProxy
        # sees the real client (matches the /api/ block).
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # SSE stream: disable buffering so events flush immediately.
    location = /api/v1/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;  # never compress SSE
        proxy_read_timeout 3600s;
    }
    location = /api/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;  # never compress SSE
        proxy_read_timeout 3600s;
    }

    # Health/readiness/docs proxied to the backend.
    location /healthz { proxy_pass http://127.0.0.1:3000; }
    location /readyz  { proxy_pass http://127.0.0.1:3000; }
    location /docs    { proxy_pass http://127.0.0.1:3000; }

    # --- SPA fallback ----------------------------------------------------------
    # Any non-API, non-asset path serves index.html so client-side routing works.
    # index.html must NOT be cached so clients always fetch the current shell,
    # which references the latest fingerprinted /assets/* files.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        # Re-declared because this location sets its own add_header (see note above).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "0" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
