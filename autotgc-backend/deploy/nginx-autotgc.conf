# AutoTGC reverse proxy. HTTP -> HTTPS redirect handled by certbot once a domain exists.
# Until a domain/cert is configured, this serves the API over :80 to the loopback app.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME challenge location for future Let's Encrypt issuance.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 502 returned automatically by nginx if the backend is unreachable.
        proxy_connect_timeout 5s;
        # Long enough for AI text generation (DeepSeek V4) to finish; MUST be
        # >= the app's GEMINI_TIMEOUT_MS (90s) so the proxy never cuts an
        # in-flight AI request before the app can fall back. See .env.example.
        proxy_read_timeout 120s;
    }
}
