# Nginx configuration for AutoTGC SPA frontend.
# Security-hardened: no server tokens, strict headers, gzip, caching.

server {
    listen 80;
    server_name _;

    # Security: hide nginx version.
    server_tokens off;

    # Security: limit request size (prevent large payload DoS).
    client_max_body_size 1m;

    # Security: timeout settings.
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;

    # Security: buffer settings (prevent buffer overflow attacks).
    client_body_buffer_size 1k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 1k;

    # Root directory for SPA.
    root /usr/share/nginx/html;
    index index.html;

    # Health check endpoint (no auth needed).
    location /healthz {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # Security headers for all responses.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip compression.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # SPA fallback: all routes serve index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;

        # No-cache for index.html (always check for new version).
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Static assets with long cache (content-hashed filenames).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Deny access to hidden files.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
